services:
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-secret}
    volumes: [db_data:/app/data]
    networks: [store]
  frontend:
    build: {context: ., dockerfile: Dockerfile.frontend}
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [backend]
    networks: [store]
volumes:
  db_data:
networks:
  store:
